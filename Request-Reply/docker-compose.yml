version: '3.8'
services:
  reference:
    build:
      context: ./go
      dockerfile: Dockerfile_reference
    container_name: reference
    ports:
      - "5559:5559"
    networks:
      - bbs-network

  broker:
    build:
      context: ./python
      dockerfile: Dockerfile_broker
    container_name: broker
    ports:
      - "5555:5555"
      - "5556:5556"
    networks:
      - bbs-network

  pubsub-proxy:  
    build:
      context: ./python
      dockerfile: Dockerfile_servidor
    container_name: pubsub-proxy
    ports:
      - "5557:5557"
      - "5558:5558"
    volumes:
      - ./python:/app
    command: ["python", "pubsub_proxy.py"]
    networks:
      - bbs-network

  servidor-1:
    build:
      context: ./python
      dockerfile: Dockerfile_servidor
    container_name: servidor-1
    hostname: servidor-1
    volumes:
      - ./python:/app
    environment:
      - SERVER_NAME=servidor-1
      - REFERENCE_ENDPOINT=tcp://reference:5559
    depends_on:
      - broker
      - pubsub-proxy
      - reference
    networks:
      - bbs-network

  servidor-2:
    build:
      context: ./python
      dockerfile: Dockerfile_servidor
    container_name: servidor-2
    hostname: servidor-2
    volumes:
      - ./python:/app
    environment:
      - SERVER_NAME=servidor-2
      - REFERENCE_ENDPOINT=tcp://reference:5559
    depends_on:
      - broker
      - pubsub-proxy
      - reference
    networks:
      - bbs-network

  servidor-3:
    build:
      context: ./python
      dockerfile: Dockerfile_servidor
    container_name: servidor-3
    hostname: servidor-3
    volumes:
      - ./python:/app
    environment:
      - SERVER_NAME=servidor-3
      - REFERENCE_ENDPOINT=tcp://reference:5559
    depends_on:
      - broker
      - pubsub-proxy
      - reference
    networks:
      - bbs-network

  cliente-c:
    build:
      context: ./c
      dockerfile: Dockerfile_cliente
    container_name: cliente-c
    stdin_open: true
    tty: true
    depends_on:
      - broker
      - pubsub-proxy
    volumes:
      - ./c:/app
    command: ["./client"]
    networks:
      - bbs-network

  auto-client-c-1:  
    build:
      context: ./c
      dockerfile: Dockerfile_autoclient
    container_name: auto-client-c-1
    depends_on:
      - servidor-1
      - servidor-2
      - servidor-3
    volumes:
      - ./common:/app/common
    networks:
      - bbs-network

  auto-client-c-2: 
    build:
      context: ./c
      dockerfile: Dockerfile_autoclient
    container_name: auto-client-c-2
    depends_on:
      - servidor-1
      - servidor-2
      - servidor-3
    volumes:
      - ./common:/app/common
    networks:
      - bbs-network

  testes:
    build:
      context: ./python
      dockerfile: Dockerfile_servidor
    container_name: testes
    volumes:
      - ./python:/app  # Monta a pasta python inteira
      - ./tests:/app/tests
    command: sleep infinity
    networks:
      - bbs-network

networks:
  bbs-network:
    driver: bridge